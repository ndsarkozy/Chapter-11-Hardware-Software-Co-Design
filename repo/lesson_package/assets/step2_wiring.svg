<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="monospace" font-size="13">

  <!-- Background -->
  <rect width="800" height="560" fill="#1e1e2e" rx="10"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Steps 2-4 Wiring: ESP32 + parallel LCD (TC1602A) + 2 pots</text>
  <text x="400" y="50" text-anchor="middle" fill="#6c7086" font-size="11">4-bit HD44780 mode -- uses 6 GPIOs for the LCD plus a contrast pot on V0</text>

  <!-- ===== ESP32 (center) ===== -->
  <rect x="320" y="80" width="180" height="430" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="410" y="102" text-anchor="middle" fill="#89b4fa" font-weight="bold">ESP32 DevKit</text>
  <text x="410" y="118" text-anchor="middle" fill="#6c7086" font-size="10">38-pin module</text>

  <!-- ESP32 left-column pins (signal pot + contrast pot bus) -->
  <text x="332" y="148" fill="#a6e3a1" font-size="11">3.3 V</text>
  <text x="332" y="173" fill="#f38ba8" font-size="11">GND</text>
  <text x="332" y="198" fill="#cba6f7" font-size="11">GPIO 34 (ADC)</text>
  <text x="332" y="223" fill="#a6e3a1" font-size="11">5 V (VIN)</text>
  <text x="332" y="248" fill="#f38ba8" font-size="11">GND</text>

  <circle cx="320" cy="145" r="5" fill="#a6e3a1"/>
  <circle cx="320" cy="170" r="5" fill="#f38ba8"/>
  <circle cx="320" cy="195" r="5" fill="#cba6f7"/>
  <circle cx="320" cy="220" r="5" fill="#a6e3a1"/>
  <circle cx="320" cy="245" r="5" fill="#f38ba8"/>

  <!-- ESP32 right-column pins (LCD) -->
  <text x="488" y="148" text-anchor="end" fill="#fab387" font-size="11">GPIO 19  (RS)</text>
  <text x="488" y="173" text-anchor="end" fill="#fab387" font-size="11">GPIO 23  (E)</text>
  <text x="488" y="198" text-anchor="end" fill="#89dceb" font-size="11">GPIO 18  (D4)</text>
  <text x="488" y="223" text-anchor="end" fill="#89dceb" font-size="11">GPIO 5   (D5)</text>
  <text x="488" y="248" text-anchor="end" fill="#89dceb" font-size="11">GPIO 17  (D6)</text>
  <text x="488" y="273" text-anchor="end" fill="#89dceb" font-size="11">GPIO 16  (D7)</text>

  <circle cx="500" cy="145" r="5" fill="#fab387"/>
  <circle cx="500" cy="170" r="5" fill="#fab387"/>
  <circle cx="500" cy="195" r="5" fill="#89dceb"/>
  <circle cx="500" cy="220" r="5" fill="#89dceb"/>
  <circle cx="500" cy="245" r="5" fill="#89dceb"/>
  <circle cx="500" cy="270" r="5" fill="#89dceb"/>

  <!-- ===== Signal pot (left, top) ===== -->
  <rect x="40" y="120" width="200" height="110" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="140" y="142" text-anchor="middle" fill="#cba6f7" font-weight="bold">Signal pot (10k)</text>
  <text x="140" y="158" text-anchor="middle" fill="#6c7086" font-size="10">the knob the firmware reads</text>
  <text x="60" y="183" fill="#a6e3a1" font-size="11">Left  -&gt; 3.3 V</text>
  <text x="60" y="203" fill="#cba6f7" font-size="11">Wiper -&gt; GPIO 34</text>
  <text x="60" y="223" fill="#f38ba8" font-size="11">Right -&gt; GND</text>

  <circle cx="240" cy="180" r="5" fill="#a6e3a1"/>
  <circle cx="240" cy="200" r="5" fill="#cba6f7"/>
  <circle cx="240" cy="220" r="5" fill="#f38ba8"/>

  <!-- Wires: signal pot -> ESP32 -->
  <line x1="240" y1="180" x2="280" y2="180" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="280" y1="180" x2="280" y2="145" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="280" y1="145" x2="320" y2="145" stroke="#a6e3a1" stroke-width="2"/>

  <line x1="240" y1="200" x2="290" y2="200" stroke="#cba6f7" stroke-width="2"/>
  <line x1="290" y1="200" x2="290" y2="195" stroke="#cba6f7" stroke-width="2"/>
  <line x1="290" y1="195" x2="320" y2="195" stroke="#cba6f7" stroke-width="2"/>

  <line x1="240" y1="220" x2="285" y2="220" stroke="#f38ba8" stroke-width="2"/>
  <line x1="285" y1="220" x2="285" y2="170" stroke="#f38ba8" stroke-width="2"/>
  <line x1="285" y1="170" x2="320" y2="170" stroke="#f38ba8" stroke-width="2"/>

  <!-- ===== Contrast pot (left, bottom) ===== -->
  <rect x="40" y="280" width="200" height="110" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="140" y="302" text-anchor="middle" fill="#f9e2af" font-weight="bold">Contrast pot (10k)</text>
  <text x="140" y="318" text-anchor="middle" fill="#6c7086" font-size="10">turn once to make text readable</text>
  <text x="60" y="343" fill="#a6e3a1" font-size="11">Left  -&gt; 5 V</text>
  <text x="60" y="363" fill="#f9e2af" font-size="11">Wiper -&gt; LCD V0</text>
  <text x="60" y="383" fill="#f38ba8" font-size="11">Right -&gt; GND</text>

  <circle cx="240" cy="340" r="5" fill="#a6e3a1"/>
  <circle cx="240" cy="360" r="5" fill="#f9e2af"/>
  <circle cx="240" cy="380" r="5" fill="#f38ba8"/>

  <!-- Wires: contrast pot rails -> ESP32 5V/GND -->
  <line x1="240" y1="340" x2="295" y2="340" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="295" y1="340" x2="295" y2="220" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="295" y1="220" x2="320" y2="220" stroke="#a6e3a1" stroke-width="2"/>

  <line x1="240" y1="380" x2="300" y2="380" stroke="#f38ba8" stroke-width="2"/>
  <line x1="300" y1="380" x2="300" y2="245" stroke="#f38ba8" stroke-width="2"/>
  <line x1="300" y1="245" x2="320" y2="245" stroke="#f38ba8" stroke-width="2"/>

  <!-- Contrast pot wiper goes to LCD V0 (long wire across) -->
  <line x1="240" y1="360" x2="640" y2="360" stroke="#f9e2af" stroke-width="2"/>
  <line x1="640" y1="360" x2="640" y2="180" stroke="#f9e2af" stroke-width="2"/>
  <line x1="640" y1="180" x2="660" y2="180" stroke="#f9e2af" stroke-width="2"/>

  <!-- ===== LCD (right) ===== -->
  <rect x="660" y="120" width="125" height="320" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="722" y="142" text-anchor="middle" fill="#89b4fa" font-weight="bold">16x2 LCD</text>
  <text x="722" y="158" text-anchor="middle" fill="#6c7086" font-size="10">TC1602A (HD44780)</text>

  <text x="675" y="183" fill="#f38ba8" font-size="11">1  VSS  -&gt; GND</text>
  <text x="675" y="203" fill="#a6e3a1" font-size="11">2  VDD  -&gt; 5 V</text>
  <text x="675" y="223" fill="#f9e2af" font-size="11">3  V0   -&gt; pot</text>
  <text x="675" y="243" fill="#fab387" font-size="11">4  RS   -&gt; G19</text>
  <text x="675" y="263" fill="#f38ba8" font-size="11">5  RW   -&gt; GND</text>
  <text x="675" y="283" fill="#fab387" font-size="11">6  E    -&gt; G23</text>
  <text x="675" y="303" fill="#6c7086" font-size="11">7-10 D0-D3 NC</text>
  <text x="675" y="323" fill="#89dceb" font-size="11">11 D4   -&gt; G18</text>
  <text x="675" y="343" fill="#89dceb" font-size="11">12 D5   -&gt; G5</text>
  <text x="675" y="363" fill="#89dceb" font-size="11">13 D6   -&gt; G17</text>
  <text x="675" y="383" fill="#89dceb" font-size="11">14 D7   -&gt; G16</text>
  <text x="675" y="403" fill="#a6e3a1" font-size="11">15 A    -&gt; 5 V*</text>
  <text x="675" y="423" fill="#f38ba8" font-size="11">16 K    -&gt; GND</text>

  <!-- LCD pin dots -->
  <circle cx="660" cy="180" r="4" fill="#f38ba8"/>
  <circle cx="660" cy="200" r="4" fill="#a6e3a1"/>
  <circle cx="660" cy="220" r="4" fill="#f9e2af"/>
  <circle cx="660" cy="240" r="4" fill="#fab387"/>
  <circle cx="660" cy="260" r="4" fill="#f38ba8"/>
  <circle cx="660" cy="280" r="4" fill="#fab387"/>
  <circle cx="660" cy="320" r="4" fill="#89dceb"/>
  <circle cx="660" cy="340" r="4" fill="#89dceb"/>
  <circle cx="660" cy="360" r="4" fill="#89dceb"/>
  <circle cx="660" cy="380" r="4" fill="#89dceb"/>
  <circle cx="660" cy="400" r="4" fill="#a6e3a1"/>
  <circle cx="660" cy="420" r="4" fill="#f38ba8"/>

  <!-- Wires: ESP32 right pins -> LCD signal pins -->
  <!-- RS (G19 -> LCD pin 4) -->
  <line x1="500" y1="145" x2="540" y2="145" stroke="#fab387" stroke-width="2"/>
  <line x1="540" y1="145" x2="540" y2="240" stroke="#fab387" stroke-width="2"/>
  <line x1="540" y1="240" x2="660" y2="240" stroke="#fab387" stroke-width="2"/>

  <!-- E (G23 -> LCD pin 6) -->
  <line x1="500" y1="170" x2="550" y2="170" stroke="#fab387" stroke-width="2"/>
  <line x1="550" y1="170" x2="550" y2="280" stroke="#fab387" stroke-width="2"/>
  <line x1="550" y1="280" x2="660" y2="280" stroke="#fab387" stroke-width="2"/>

  <!-- D4 (G18 -> LCD pin 11) -->
  <line x1="500" y1="195" x2="560" y2="195" stroke="#89dceb" stroke-width="2"/>
  <line x1="560" y1="195" x2="560" y2="320" stroke="#89dceb" stroke-width="2"/>
  <line x1="560" y1="320" x2="660" y2="320" stroke="#89dceb" stroke-width="2"/>

  <!-- D5 (G5 -> LCD pin 12) -->
  <line x1="500" y1="220" x2="570" y2="220" stroke="#89dceb" stroke-width="2"/>
  <line x1="570" y1="220" x2="570" y2="340" stroke="#89dceb" stroke-width="2"/>
  <line x1="570" y1="340" x2="660" y2="340" stroke="#89dceb" stroke-width="2"/>

  <!-- D6 (G17 -> LCD pin 13) -->
  <line x1="500" y1="245" x2="580" y2="245" stroke="#89dceb" stroke-width="2"/>
  <line x1="580" y1="245" x2="580" y2="360" stroke="#89dceb" stroke-width="2"/>
  <line x1="580" y1="360" x2="660" y2="360" stroke="#89dceb" stroke-width="2"/>

  <!-- D7 (G16 -> LCD pin 14) -->
  <line x1="500" y1="270" x2="590" y2="270" stroke="#89dceb" stroke-width="2"/>
  <line x1="590" y1="270" x2="590" y2="380" stroke="#89dceb" stroke-width="2"/>
  <line x1="590" y1="380" x2="660" y2="380" stroke="#89dceb" stroke-width="2"/>

  <!-- LCD VSS, RW, K to GND (red, branched off pot rails) -->
  <line x1="600" y1="180" x2="660" y2="180" stroke="#f38ba8" stroke-width="2"/>
  <line x1="600" y1="180" x2="600" y2="245" stroke="#f38ba8" stroke-width="2"/>
  <line x1="600" y1="245" x2="660" y2="245" stroke="none"/>

  <line x1="610" y1="260" x2="660" y2="260" stroke="#f38ba8" stroke-width="2"/>
  <line x1="610" y1="260" x2="610" y2="420" stroke="#f38ba8" stroke-width="2"/>
  <line x1="610" y1="420" x2="660" y2="420" stroke="#f38ba8" stroke-width="2"/>

  <!-- LCD VDD + A to 5V (green) -->
  <line x1="620" y1="200" x2="660" y2="200" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="620" y1="200" x2="620" y2="400" stroke="#a6e3a1" stroke-width="2"/>
  <line x1="620" y1="400" x2="660" y2="400" stroke="#a6e3a1" stroke-width="2"/>

  <!-- ===== Legend ===== -->
  <rect x="40" y="450" width="745" height="100" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="60" y="470" fill="#cdd6f4" font-weight="bold">Notes</text>

  <text x="60" y="490" fill="#cdd6f4" font-size="11">* LCD pin 15 (A) backlight: connect to 5 V through a 220 ohm resistor if your module has no built-in resistor.</text>
  <text x="60" y="508" fill="#cdd6f4" font-size="11">  LCD pins 7-10 (D0-D3) are unused in 4-bit mode -- leave them disconnected.</text>
  <text x="60" y="526" fill="#cdd6f4" font-size="11">  Two separate 10k pots: one for the signal (wiper -&gt; GPIO 34), one for contrast (wiper -&gt; LCD V0).</text>
  <text x="60" y="544" fill="#cdd6f4" font-size="11">  Library: built-in `LiquidCrystal` (no Library Manager install needed).</text>

</svg>
